tools:
  - name: clarify
    description: "Hỏi người dùng/DPO để bổ sung thông tin thiếu (như dataset_name, columns, proposal_id, view_name) hoặc xin xác nhận/phê duyệt DPO trước khi sinh SQL view/báo cáo."
    parameters:
      type: object
      properties:
        question: {type: string, description: "Nội dung câu hỏi xin ý kiến hoặc xác nhận phê duyệt"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "yes_no", description: "Kiểu phản hồi kỳ vọng"}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách các lựa chọn khi response_type là choice"}
      required: [question]

  - name: scan_dataset_pii
    description: "Quét và kiểm tra một file/bảng dữ liệu để phát hiện tất cả các cột chứa thông tin định danh cá nhân PII. Dùng khi nhận được yêu cầu quét PII, scan PII."
    parameters:
      type: object
      properties:
        dataset_name: {type: string, description: "Tên file dataset cần quét (ví dụ: sample_pii.csv, pii_dataset.csv)"}
      required: [dataset_name]

  - name: classify_pii_sensitivity
    description: "Phân loại và đánh giá mức độ nhạy cảm của dữ liệu cá nhân (HIGH, MEDIUM, LOW) theo Nghị định 13/2023/NĐ-CP cho danh sách các cột chỉ định. Dùng khi yêu cầu 'phân loại độ nhạy cảm', 'dánh giá rủi ro PII'."
    parameters:
      type: object
      properties:
        dataset_name: {type: string, description: "Tên file hoặc bảng dữ liệu (ví dụ: sample_pii.csv, pii_dataset.csv)"}
        columns:
          type: array
          items: {type: string}
          description: "Danh sách tên các cột cần phân loại nhạy cảm (ví dụ: ['email', 'phone'])"
      required: [dataset_name, columns]

  - name: propose_masking_policy
    description: "Đề xuất quy tắc che/mã hóa dữ liệu phù hợp (HASH, MASK_MIDDLE, GENERALIZE, ANONYMIZE) cho các cột PII trong dataset. Dùng khi yêu cầu 'đề xuất che mờ', 'đề xuất masking policy', 'tạo quy tắc che'."
    parameters:
      type: object
      properties:
        dataset_name: {type: string, description: "Tên file dataset cần áp dụng quy tắc che mờ"}
        rules:
          type: array
          description: "Danh sách quy tắc che mờ cho từng cột"
          items:
            type: object
            properties:
              column: {type: string, description: "Tên cột cần che (ví dụ: email, phone, job, username)"}
              action: {type: string, enum: [HASH, MASK_MIDDLE, GENERALIZE, ANONYMIZE], description: "Quy tắc mã hóa/che mờ"}
            required: [column, action]
      required: [dataset_name, rules]

  - name: search_legal_compliance
    description: "Tra cứu các điều khoản, nghĩa vụ pháp lý trong Nghị định 13/2023/NĐ-CP hoặc GDPR liên quan đến bảo vệ dữ liệu cá nhân, dữ liệu vị trí địa lý, danh tính."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Từ khóa hoặc nội dung pháp lý cần tra cứu"}
        regulation: {type: string, default: "Nghi dinh 13/2023/ND-CP", description: "Tên văn bản pháp lý (mặc định: Nghi dinh 13/2023/ND-CP)"}
      required: [query, regulation]

  - name: audit_data_access
    description: "Rà soát nhật ký truy cập (Access Log) của một dataset để kiểm tra các hành vi truy cập PII thô của tài khoản nội bộ hoặc bất thường. Dùng khi yêu cầu 'audit log', 'kiểm tra truy cập', 'rà soát log'."
    parameters:
      type: object
      properties:
        dataset_name: {type: string, description: "Tên dataset cần rà soát log truy cập (ví dụ: sample_pii.csv, pii_dataset.csv)"}
      required: [dataset_name]

  - name: generate_compliance_report
    description: "Tổng hợp báo cáo tuân thủ rà soát bảo vệ dữ liệu cá nhân dạng Markdown trình DPO/Ban Giám đốc từ mã proposal_id đã lập. Dùng khi yêu cầu 'tạo compliance report', 'xuất báo cáo tuân thủ'."
    parameters:
      type: object
      properties:
        dataset_name: {type: string, description: "Tên file hoặc bảng dữ liệu"}
        proposal_id: {type: string, description: "Mã bản thảo đề xuất chính sách (ví dụ: PROP_5001, PROP_6002)"}
      required: [dataset_name, proposal_id]

  - name: generate_masked_view
    description: "Sinh câu lệnh SQL CREATE VIEW chứa dữ liệu đã che mờ (v_..._masked) từ mã đề xuất đã được DPO phê duyệt. Dùng khi DPO đã phê duyệt hoặc sau khi có xác nhận phê duyệt từ DPO."
    parameters:
      type: object
      properties:
        dataset_name: {type: string, description: "Tên dataset gốc (ví dụ: sample_pii.csv, pii_dataset.csv)"}
        proposal_id: {type: string, description: "Mã đề xuất đã được DPO duyệt (ví dụ: PROP_5001, PROP_6001)"}
        view_name: {type: string, description: "Tên SQL View mới cần sinh (ví dụ: v_sample_masked, v_pii_masked)"}
      required: [dataset_name, proposal_id, view_name]
