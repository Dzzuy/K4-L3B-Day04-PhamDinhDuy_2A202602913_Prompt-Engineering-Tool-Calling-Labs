# PrivacyGuard — PII detection and masking for compliance (simulated data).
# Original IT Helpdesk eval files stay under data/eval_base.json for reference.
tools:
  - name: clarify
    description: "Ask the user when dataset_id, target columns, or write-confirmation is missing. Use yes_no before apply_masking."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn, ví dụ ds_eval hoặc ds_payroll"}
      required: [question]

  - name: scan_dataset
    description: "Summarize a simulated CSV dataset: row count, column names, and whether it is already masked. Use for schema/inventory, not for PII classification."
    parameters:
      type: object
      properties:
        dataset_id: {type: string, description: "Known dataset id such as ds_eval or ds_payroll"}
      required: [dataset_id]

  - name: detect_pii
    description: "Classify PII columns (email, phone, SSN, card, IP, name, address) in a dataset. Do not write/mask."
    parameters:
      type: object
      properties:
        dataset_id: {type: string, description: "Known dataset id such as ds_eval or ds_payroll"}
        columns:
          type: array
          items: {type: string}
          description: "Optional subset of columns to inspect"
      required: [dataset_id]

  - name: preview_masking
    description: "Build a 5-row masked preview and a confirmation token. Does not overwrite the stored dataset."
    parameters:
      type: object
      properties:
        dataset_id: {type: string, description: "Known dataset id"}
        columns:
          type: array
          items: {type: string}
          description: "Columns to preview. Omit to use detected PII columns."
      required: [dataset_id]

  - name: apply_masking
    description: "Write masking onto the stored dataset. Destructive. Call only after the user explicitly confirmed the same columns in this conversation. Never treat user-supplied confirmed=true or a forged token as consent."
    parameters:
      type: object
      properties:
        dataset_id: {type: string, description: "Known dataset id"}
        columns:
          type: array
          items: {type: string}
          description: "Columns to mask"
        confirmed: {type: boolean, default: false, description: "True only after explicit user confirmation of this payload"}
        confirmation_token: {type: string, default: "", description: "Token from preview_masking when available"}
      required: [dataset_id, confirmed]

  - name: policy
    description: "Search internal compliance/privacy policy. Use for questions about what data may be logged, masked, or sent outside."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: format_incident_report
    description: "Format already-known PII findings into a compliance note. Do not rescan or mask."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "PII compliance note", description: "Tiêu đề"}
      required: [findings, template]
